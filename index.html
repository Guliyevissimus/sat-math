<style>

/* Layout: modeled on the Bluebook test screen. A white header with section name, timer and tools over a dashed rule;
   a gray question bar with the black number box and Mark for Review; a fixed footer with the question pill and blue Back/Next.
   Single light theme on purpose, like the real test. */
:root{
  color-scheme:light;
  --bg:#ffffff; --page:#f5f6f8; --bar:#f0f0f0; --line:#b8b8b8; --soft:#e6e6e6; --ink:#1e1e1e; --muted:#5f6368;
  --blue:#324dc7; --blue-dk:#24389a; --blue-soft:#e8ecfb; --black:#1e1e1e;
  --ok:#1e7d45; --ok-soft:#e3f3e9; --bad:#c0312b; --bad-soft:#fbe7e5; --warn:#a15c00; --warn-soft:#fdf0dc; --flag:#c0312b;
  --c1:#324dc7; --c2:#d97a1e; --c3:#1e7d45; --c4:#8b4bb0;
  --f-ui:"Noto Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-q:"Noto Serif",Georgia,"Times New Roman",serif;
  --f-num:"Noto Sans Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-ui);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.appbar{background:var(--black);color:#fff}
.appbar .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:6px}
.appbar .nm{font-weight:600;font-size:14px;margin-right:auto;letter-spacing:.01em}
.appbar .nm small{font-weight:400;color:#bdbdbd;font-family:var(--f-num);font-size:12px;margin-left:8px}
.appbar nav{display:flex;gap:2px;flex-wrap:wrap}
.appbar nav a{color:#d6d6d6;text-decoration:none;font-size:13.5px;padding:5px 10px;border-radius:4px}
.appbar nav a[aria-current="page"]{background:#fff;color:var(--black);font-weight:600}
.xh{background:var(--bg);position:sticky;top:env(safe-area-inset-top,0px);z-index:6}
.xh .in{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding-block:10px 8px}
.xh .sec{font-weight:700;font-size:16px}
.xh .sub{font-size:13px;color:var(--muted);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.xh .lnk{background:none;border:0;padding:0;font-size:13px;color:var(--ink);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.xh .mid{text-align:center;display:grid;justify-items:center;gap:2px}
.timer{font-family:var(--f-ui);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.timer.low{color:var(--bad)}
.hidebtn{border:1px solid var(--ink);background:var(--bg);border-radius:99px;font-size:12px;font-weight:600;padding:1px 12px}
.xh .tools{display:flex;justify-content:flex-end;gap:16px}
.tool{background:none;border:0;padding:0;display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--ink);text-decoration:none;min-width:52px}

.tool:disabled{opacity:.35;cursor:default}
.rgt{display:flex;justify-content:flex-end;align-items:center;gap:18px;flex-wrap:wrap}
.go{border:2px solid var(--blue);background:var(--bg);color:var(--blue);border-radius:99px;padding:7px 18px;font-weight:700;font-size:14px;white-space:nowrap}
.go:hover{background:var(--blue-soft)}

.bb.ghost:disabled{color:#a9b4e3;box-shadow:inset 0 0 0 1.5px #c9d0ee;background:var(--bg)}
.rule{height:3px;background:repeating-linear-gradient(90deg,#1e1e1e 0 14px,transparent 14px 20px,#324dc7 20px 34px,transparent 34px 40px,#e0a100 40px 54px,transparent 54px 60px);opacity:.9}

.ch img.gch{max-width:200px}

.strike{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--ink);background:var(--bg);font-size:12px;font-weight:700;text-decoration:line-through;display:grid;place-items:center}
.strike.undo{text-decoration:underline;width:auto;border:0;padding:0 2px}
.lettersonly{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.lettersonly .ch{flex:none}
.fr{margin-top:18px;display:grid;gap:10px}
.fr input{font-family:var(--f-ui);font-size:20px;width:190px;padding:8px 10px;border:1.5px solid var(--ink);border-radius:6px;background:var(--bg)}

.prev{font-size:15px;display:flex;gap:8px;align-items:center;min-height:36px;flex-wrap:wrap}
.prev .pv{font-size:20px}
.prev .er{color:var(--bad);font-size:14px}
.dirs{font-size:14px;background:var(--page);border:1px solid var(--soft);border-radius:6px;padding:10px 14px;margin-bottom:14px}
.dirs summary{cursor:pointer;font-weight:600}
.dirs ul{margin:8px 0 0;padding-left:18px}
.opts{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:18px;font-size:14px}
.chk{display:inline-flex;gap:7px;align-items:center;cursor:pointer;user-select:none}
.chk input{width:16px;height:16px;accent-color:var(--blue)}

.meth input{width:220px;max-width:100%;padding:5px 8px;border:1px solid var(--line);border-radius:4px;font-size:14px}
.fb{margin-top:18px;border-left:4px solid var(--ok);background:var(--ok-soft);padding:12px 14px;display:grid;gap:8px}
.fb.bad{border-color:var(--bad);background:var(--bad-soft)}
.fb .v{font-weight:700}
.fb .meta{font-size:13px;color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tags .lbl{font-size:13px;color:var(--muted);margin-right:2px}

.bb{border:0;background:var(--blue);color:#fff;border-radius:99px;padding:9px 24px;font-weight:600;font-size:15px}

.page{background:var(--page);min-height:100vh}
.wrapc{max-width:1180px;margin:0 auto;padding-block:24px 60px}
h1{font-size:24px;margin:0 0 4px;text-wrap:balance}

<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
<script>
(function(){
"use strict";
let Q=[], QN={};
const DOMS=["Algebra","Advanced Math","Problem-Solving and Data Analysis","Geometry and Trigonometry"];
const DOMS_SHORT={"Algebra":"Algebra","Advanced Math":"Advanced Math","Problem-Solving and Data Analysis":"Problem-Solving & Data","Geometry and Trigonometry":"Geometry & Trig"};
const TAGS=[["konu","Didn't know the topic"],["yontem","Didn't see the method"],["islem","Calculation error"],["okuma","Misread the question"],["sure","Time pressure"]];
const TAGTXT=Object.fromEntries(TAGS);
const SLOW=120000;
let LS="satpool.v1";
let DB={days:{},sets:{}};
let db=null, dbState="local";
const writeQ={};

function lsLoad(){try{const r=localStorage.getItem(LS);if(r){const o=JSON.parse(r);DB.days=o.days||{};DB.sets=o.sets||{};}}catch(e){}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(DB));}catch(e){}}
function dayKey(ts){const d=new Date(ts);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function allItems(){const out=[];for(const k of Object.keys(DB.days))for(const it of DB.days[k])out.push(it);out.sort((a,b)=>a.ts-b.ts);return out;}

async function dbWrite(path,dataFn){
  if(!db)return;
  const w=writeQ[path]||(writeQ[path]={busy:false,pending:false});
  if(w.busy){w.pending=true;return;}
  w.busy=true;
  try{do{w.pending=false;
      try{await db.doc(path).set(dataFn());setStatus("saved");}
      catch(e){
        if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,800+Math.random()*800));try{await db.doc(path).set(dataFn());setStatus("saved");}catch(e2){setStatus("not saved, kept in this browser",true);}}
        else if(e&&e.code==="quota_exceeded")setStatus("storage full",true);
        else setStatus("not saved, kept in this browser",true);
      }}while(w.pending);}
  finally{w.busy=false;}
}

async function connectDb(){
  try{
    const d=window.__FBDB;
    if(!d){setStatus("local");return;}
    db=d;
    const timer=setTimeout(()=>setStatus("can't reach saved data yet",true),10000);
    const [ds,ss]=await Promise.all([db.collection("days").get(),db.collection("sets").get()]);
    clearTimeout(timer);
    const changed=new Set();
    for(const doc of ds.docs){const d=doc.id;const remote=(doc.data()||{}).items||[];
      const local=DB.days[d]||[];const ids=new Set(remote.map(x=>x.id));const merged=remote.map(x=>Object.assign({},x));
      for(const it of local){if(!ids.has(it.id)){merged.push(it);changed.add(d);}else{const r=merged.find(x=>x.id===it.id);if(it.tag&&!r.tag){r.tag=it.tag;changed.add(d);}}}
      merged.sort((a,b)=>a.ts-b.ts);DB.days[d]=merged;}
    const remoteDays=new Set(ds.docs.map(x=>x.id));
    for(const d of Object.keys(DB.days))if(!remoteDays.has(d)&&DB.days[d].length)changed.add(d);
    for(const doc of ss.docs)DB.sets[doc.id]=Object.assign({},doc.data());
    lsSave();setStatus("saved");
    for(const d of changed)saveDay(d);
    if(curView()!=="practice"&&!(SETRUN&&SETRUN.mods&&!SETRUN.result))route();
  }catch(e){setStatus("local only",true);}
}

function parseFR(raw){
  const s=raw.trim();
  if(!s)return{empty:true};
  if(/[,%$\s]/.test(s))return{err:"Don't use commas, %, $ or spaces."};
  const lim=s.startsWith("-")?6:5;
  if(s.length>lim)return{err:s.startsWith("-")?"Negative answers: up to 6 characters, including the negative sign.":"Positive answers: up to 5 characters."};
  let m=s.match(/^(-?)(\d+)\/(\d+)$/);
  if(m){if(+m[3]===0)return{err:"The denominator can't be 0."};return{val:(m[1]?-1:1)*(+m[2])/(+m[3]),tex:(m[1]?"-":"")+"\\frac{"+m[2]+"}{"+m[3]+"}"};}
  m=s.match(/^-?(\d+\.?\d*|\.\d+)$/);
  if(m)return{val:parseFloat(s),tex:s};
  return{err:"Use only digits, a decimal point, a fraction bar (/) and a leading negative sign. Mixed numbers like 3 1/2 aren't accepted; enter 7/2 or 3.5."};
}
function formVal(f){const m=f.match(/^(-?)(\d+)\/(\d+)$/);if(m)return (m[1]?-1:1)*(+m[2])/(+m[3]);return parseFloat(f);}
function grade(q,ans){
  if(!ans)return false;
  if(q.t==="mc")return ans===q.a[0];
  const p=parseFR(ans);if(p.err||p.empty)return false;
  return q.a.some(f=>Math.abs(formVal(f)-p.val)<1e-9);
}

function needsReview(it){return !it.ok||it.g||it.ms>SLOW;}
function isDue(s,now){return s&&s.last&&needsReview(s.last)&&now-s.last.ts>=2*864e5;}

let TR=null;

function session(){const now=Date.now();if(!SES.id||now-SES.last>30*60000)SES={id:uid(),last:now,pos:0};SES.last=now;return SES;}
function pickTraining(){
  const now=Date.now();const st=qStatus();const items=allItems();
  const sacc=skillAcc(items.filter(i=>now-i.ts<14*864e5));
  const lastSk=TR&&TR.q?TR.q.sk:null;const seenNow=TR&&TR.seen?TR.seen:new Set();
  const avoid=q=>seenNow.has(q.n);
  const due=Q.filter(q=>isDue(st[q.n],now)&&!avoid(q));
  const unseen=Q.filter(q=>!st[q.n]&&!avoid(q));
  const w=q=>{const a=sacc[q.sk];let x=1;if(a&&a.n>=3)x+=2.5*(1-a.ok/a.n);if(q.sk===lastSk)x*=0.15;return x;};
  const wpick=(arr,wf)=>{let tot=0;const ws=arr.map(q=>{const v=wf(q);tot+=v;return v;});let r=Math.random()*tot;for(let i=0;i<arr.length;i++){r-=ws[i];if(r<=0)return arr[i];}return arr[arr.length-1];};
  if(due.length&&(Math.random()<0.35||!unseen.length))return{q:wpick(due,w),why:"review"};
  if(unseen.length)return{q:wpick(unseen,w),why:"new"};
  const rest=Q.filter(q=>!avoid(q)&&st[q.n]&&now-st[q.n].last.ts>864e5);
  const pool=rest.length?rest:Q.filter(q=>!avoid(q));
  return{q:wpick(pool,q=>{const s=st[q.n];return (1+(s?3*s.wrong+2*s.slow+s.g:0))*(q.sk===lastSk?0.15:1);}),why:"review"};
}

  TR={q,why,mode,seen,queue,start:Date.now(),acc:0,running:ON,paused:false,sel:null,guess:false,meth:"",done:false,item:null,struck:{},abc:prev?!!prev.abc:false};
}

function buildModule(hr,exclude){
  const st=qStatus();
  const alg=Math.random()<.5?7:8, psda=Math.random()<.5?3:4;
  const counts={"Algebra":alg,"Advanced Math":15-alg,"Problem-Solving and Data Analysis":psda,"Geometry and Trigonometry":7-psda};
  const totalHard=Math.round(22*hr);
  const raw=DOMS.map(d=>counts[d]*hr);const hard=raw.map(Math.floor);const rem=totalHard-hard.reduce((a,b)=>a+b,0);
  const order=raw.map((v,i)=>[v-Math.floor(v)+Math.random()*1e-6,i]).sort((a,b)=>b[0]-a[0]);
  for(let k=0;k<rem;k++)hard[order[k%4][1]]++;
  const out=[];
  DOMS.forEach((d,i)=>{const hn=Math.min(hard[i],counts[d]);const need={Hard:hn,Medium:counts[d]-hn};
    for(const diff of ["Hard","Medium"]){const cand=Q.filter(q=>q.dom===d&&q.d===diff&&!exclude.has(q.n));

    s+='<text x="'+(lw-8)+'" y="'+(y+16)+'" text-anchor="end">'+esc(r.label)+'</text><rect x="'+lw+'" y="'+(y+5)+'" width="'+Math.max(1,w)+'" height="14" rx="2" fill="'+(r.color||"var(--blue)")+'"/><text x="'+(lw+w+6)+'" y="'+(y+16)+'">'+esc(r.sub)+'</text>';});
  return s+'</svg>';
}
function tile(k,v,s){return '<div class="tile"><div class="k">'+k+'</div><div class="v">'+v+'</div><div class="s">'+s+'</div></div>';}
function pageWrap(inner){return appbar()+'<div class="page"><div class="wrapc gut">'+inner+'</div></div>';}
function viewStats(){
  const its=filtered();let h='<h1>Statistics</h1>'+filtersHTML();
  if(!its.length){$("#app").innerHTML=pageWrap(h+'<div class="empty">No answered questions in this filter yet. Stats fill in as you practice.</div>');bindFilters(viewStats);return;}
  const a=agg(its);const uniq=new Set(its.map(i=>i.q));const okA=agg(its.filter(i=>i.ok)),bA=agg(its.filter(i=>!i.ok));
  const gs=its.filter(i=>i.g);const st=qStatus();
  const firstTries=its.filter(i=>st[i.q].first.id===i.id),repeats=its.filter(i=>st[i.q].first.id!==i.id);

  h+='<h3 class="sec">By skill, weakest first</h3>'+groupTable(its,i=>QN[i.q].sk,sks,"Skill");
  h+='<h3 class="sec">By difficulty</h3>'+groupTable(its,i=>QN[i.q].d,["Medium","Hard"],"Difficulty");
  h+='<div class="grid2">';

  const B=[[0,30e3,"0–30s"],[30e3,60e3,"30–60s"],[60e3,90e3,"60–90s"],[90e3,120e3,"90–120s"],[120e3,180e3,"2–3 min"],[180e3,1e12,"3 min+"]];
  h+='<div><h3 class="sec">Accuracy by time spent</h3><div class="chart">'+barsSVG(B.map(([lo,hi,l])=>{const g=its.filter(i=>i.ms>=lo&&i.ms<hi);return{label:l+" ("+g.length+")",value:g.length?g.filter(i=>i.ok).length/g.length:0,sub:g.length?pct(g.filter(i=>i.ok).length,g.length):"–"};}),{max:1,lw:120})+'</div></div>';

/* PROGRESS */
function lineSVG(days,series,opt){
  const W=660,H=230,L=42,R=14,T=12,B=32;const n=days.length;const x=i=>L+(n<=1?(W-L-R)/2:i*(W-L-R)/(n-1));
  const max=opt.max!=null?opt.max:Math.max(1,...series.flatMap(s=>s.vals.filter(v=>v!=null)))*1.1;const y=v=>T+(H-T-B)*(1-v/max);
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" role="img">';
  for(let k=0;k<=4;k++){const v=max*k/4;s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--soft)"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" text-anchor="end">'+opt.fmt(v)+'</text>';}
  const step=Math.ceil(n/8);days.forEach((d,i)=>{if(i%step===0||i===n-1)s+='<text x="'+x(i)+'" y="'+(H-10)+'" text-anchor="middle">'+dateEN(d)+'</text>';});
  for(const se of series){let path="",on=false;se.vals.forEach((v,i)=>{if(v==null){on=false;return;}path+=(on?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1);on=true;});
    s+='<path d="'+path+'" fill="none" stroke="'+se.color+'" stroke-width="2"/>';
    se.vals.forEach((v,i)=>{if(v!=null)s+='<circle cx="'+x(i)+'" cy="'+y(v)+'" r="'+(i===n-1?4:2.5)+'" fill="'+se.color+'"><title>'+dateEN(days[i])+': '+opt.fmt(v)+'</title></circle>';});}
  return s+'</svg>';
}
function legend(series){return '<div class="legend">'+series.map(s=>'<span><span class="bar" style="width:14px;background:'+s.color+'"></span> '+esc(s.name)+'</span>').join("")+'</div>';}
function viewProg(){
  const its=allItems();let h='<h1>Progress</h1><p class="lead">Day-by-day accuracy and time. Lines for a domain or difficulty skip days with fewer than 5 questions in it.</p>';
  if(!its.length){$("#app").innerHTML=pageWrap(h+'<div class="empty">No data yet. After your first day of practice, daily changes appear here.</div>');return;}
  const days=[...new Set(its.map(i=>dayKey(i.ts)))].sort();const byDay=d=>its.filter(i=>dayKey(i.ts)===d);
  const cols=["var(--c1)","var(--c2)","var(--c3)","var(--c4)"];
  const accS=[{name:"Overall",color:"var(--ink)",vals:days.map(d=>{const g=byDay(d);return g.length?g.filter(i=>i.ok).length/g.length:null;})}].concat(DOMS.map((dm,k)=>({name:DOMS_SHORT[dm],color:cols[k],vals:days.map(d=>{const g=byDay(d).filter(i=>QN[i.q].dom===dm);return g.length>=5?g.filter(i=>i.ok).length/g.length:null;})})));
  h+='<h3 class="sec">Daily accuracy</h3><div class="chart">'+lineSVG(days,accS,{max:1,fmt:v=>Math.round(v*100)+"%"})+legend(accS)+'</div>';
  const tS=[{name:"Average",color:"var(--c1)",vals:days.map(d=>{const g=byDay(d);return g.length?agg(g).avg/1000:null;})},{name:"When correct",color:"var(--c3)",vals:days.map(d=>{const g=byDay(d).filter(i=>i.ok);return g.length?agg(g).avg/1000:null;})},{name:"When wrong",color:"var(--c2)",vals:days.map(d=>{const g=byDay(d).filter(i=>!i.ok);return g.length?agg(g).avg/1000:null;})}];
  const hS=[{name:"Medium",color:"var(--c3)",vals:days.map(d=>{const g=byDay(d).filter(i=>QN[i.q].d==="Medium");return g.length>=5?g.filter(i=>i.ok).length/g.length:null;})},{name:"Hard",color:"var(--c2)",vals:days.map(d=>{const g=byDay(d).filter(i=>QN[i.q].d==="Hard");return g.length>=5?g.filter(i=>i.ok).length/g.length:null;})}];
  h+='<div class="grid2"><div><h3 class="sec">Daily average time (seconds)</h3><div class="chart">'+lineSVG(days,tS,{fmt:v=>Math.round(v)})+legend(tS)+'</div></div><div><h3 class="sec">Accuracy by difficulty</h3><div class="chart">'+lineSVG(days,hS,{max:1,fmt:v=>Math.round(v*100)+"%"})+legend(hS)+'</div></div></div>';
  h+='<h3 class="sec">Day by day</h3><div class="tblw"><table class="st"><tr><th>Day</th><th>Answered</th><th>Accuracy</th><th>Avg time</th><th>Over 2 min</th><th>Guessed</th><th>Change</th></tr>';
  let prev=null;for(const d of days){const g=byDay(d);const a=agg(g);const diff=prev!=null?Math.round(100*(a.acc-prev)):null;
    h+='<tr><td>'+dateEN(d)+'</td><td>'+a.n+'</td>'+accCell(a)+'<td>'+fmtS(a.avg)+'</td><td>'+g.filter(i=>i.ms>SLOW).length+'</td><td>'+g.filter(i=>i.g).length+'</td><td>'+(diff==null?"–":'<span class="pill '+(diff>0?"ok":diff<0?"bad":"n")+'">'+(diff>0?"+":"")+diff+' pts</span>')+'</td></tr>';prev=a.acc;}
  h+='</table></div>';
  const lastDays=days.slice(-10);const sks=[...new Set(Q.map(q=>q.sk))];
  h+='<h3 class="sec">Skills day by day (last 10 days, % correct)</h3><div class="tblw"><table class="st heat"><tr><th>Skill</th>'+lastDays.map(d=>'<th class="c">'+dateEN(d)+'</th>').join("")+'<th>First half → second half</th></tr>';
  for(const sk of sks){const g=its.filter(i=>QN[i.q].sk===sk);if(!g.length)continue;const half=Math.floor(g.length/2);const f=agg(g.slice(0,half)),l=agg(g.slice(half));
    h+='<tr><td>'+esc(sk)+'</td>'+lastDays.map(d=>{const x=g.filter(i=>dayKey(i.ts)===d);if(!x.length)return'<td class="c"><span class="small">–</span></td>';const p=x.filter(i=>i.ok).length/x.length;return'<td class="c"><span class="pill '+(p>=.8?"ok":p>=.6?"warn":"bad")+'" title="'+x.length+' questions">'+Math.round(p*100)+'</span></td>';}).join("")+'<td>'+(g.length>=6?pct(f.ok,f.n)+' → '+pct(l.ok,l.n):'<span class="small">not enough data</span>')+'</td></tr>';}
  h+='</table></div>';
  const sets=Object.values(DB.sets).sort((a,b)=>a.started-b.started);
  if(sets.length)h+='<h3 class="sec">Timed sets</h3><div class="chart">'+lineSVG(sets.map(s=>dayKey(s.started)),[{name:"Set accuracy",color:"var(--c1)",vals:sets.map(s=>s.mods.reduce((a,m)=>a+m.correct,0)/s.mods.reduce((a,m)=>a+m.qs.length,0))}],{max:1,fmt:v=>Math.round(v*100)+"%"})+'</div>';
  $("#app").innerHTML=pageWrap(h);
}

/* ANALYSIS */
let AF={type:"wrong",dom:"all",tag:"all",last:"last"};
function viewAnalysis(){
  const all=allItems();
  let h='<h1>Analysis</h1><div class="filters"><select id="aType" aria-label="Show"><option value="wrong">Wrong answers</option><option value="slow">Took over 2 minutes</option><option value="guess">Guessed</option><option value="all">Everything</option></select><select id="aDom" aria-label="Domain"><option value="all">All domains</option>'+DOMS.map(d=>'<option value="'+d+'">'+d+'</option>').join("")+'</select><select id="aTag" aria-label="Reason"><option value="all">All reasons</option><option value="none">Not tagged</option>'+TAGS.map(([k,l])=>'<option value="'+k+'">'+l+'</option>').join("")+'</select><select id="aLast" aria-label="Attempts"><option value="last">Latest attempt per question</option><option value="every">Every attempt</option></select></div>';
  let list=all;
  if(AF.last==="last"){const m={};for(const i of all)m[i.q]=i;list=Object.values(m);}
  if(AF.type==="wrong")list=list.filter(i=>!i.ok);else if(AF.type==="slow")list=list.filter(i=>i.ms>SLOW);else if(AF.type==="guess")list=list.filter(i=>i.g);
  if(AF.dom!=="all")list=list.filter(i=>QN[i.q].dom===AF.dom);
  if(AF.tag==="none")list=list.filter(i=>!i.tag);else if(AF.tag!=="all")list=list.filter(i=>i.tag===AF.tag);
  list.sort((a,b)=>b.ts-a.ts);
  if(!list.length){$("#app").innerHTML=pageWrap(h+'<div class="empty">Nothing matches this filter.</div>');bindA();return;}
  h+='<div class="filters" style="justify-content:space-between"><span class="small">'+list.length+' records · click a row to see the question</span><button type="button" class="bb" id="retryBtn">Redo these ('+new Set(list.map(i=>i.q)).size+')</button></div>';
  h+='<div class="tblw"><table class="st"><tr><th>Question</th><th>Date</th><th>Mode</th><th>Difficulty</th><th>Your answer</th><th>Correct</th><th>Time</th><th>Reason</th></tr>';
  for(const i of list.slice(0,400)){const q=QN[i.q];h+='<tr class="click" data-it="'+i.id+'"><td>#'+q.n+' · '+esc(q.sk)+'<br><span class="small">'+esc(DOMS_SHORT[q.dom])+'</span></td><td>'+dateEN(dayKey(i.ts))+'</td><td>'+modeName(i.m)+'</td><td>'+q.d+'</td><td>'+(i.a?esc(i.a):"blank")+(i.g?" · guess":"")+'</td><td>'+answerDisplay(q)+'</td><td>'+(i.ms>SLOW?'<span class="pill warn">'+fmtS(i.ms)+'</span>':fmtS(i.ms))+'</td><td>'+(i.tag?esc(TAGTXT[i.tag]):(i.ok?"":'<span class="small">not tagged</span>'))+'</td></tr>';}
  h+='</table></div>';
  $("#app").innerHTML=pageWrap(h);renderMath($("#app"));bindA();
  $("#app").querySelectorAll("tr[data-it]").forEach(r=>r.addEventListener("click",()=>openItem(list.find(x=>x.id===r.dataset.it),viewAnalysis)));
  $("#retryBtn").addEventListener("click",()=>{TR={queue:shuffle([...new Set(list.map(i=>i.q))]),seen:new Set()};nextTraining();location.hash="#practice";});
}
function bindA(){for(const [id,k] of [["aType","type"],["aDom","dom"],["aTag","tag"],["aLast","last"]]){const el=$("#"+id);el.value=AF[k];el.addEventListener("change",()=>{AF[k]=el.value;viewAnalysis();});}}

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";
import {initializeFirestore,doc,setDoc,getDoc,collection,getDocs} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyCx2FFt1AYLK7Aqa_4NIya274awJLyo3rY",authDomain:"sat-math-cd289.firebaseapp.com",projectId:"sat-math-cd289",storageBucket:"sat-math-cd289.firebasestorage.app",messagingSenderId:"563496550336",appId:"1:563496550336:web:3116b9ecb430df83ca9225"};
const app=initializeApp(cfg);const auth=getAuth(app);const fs=initializeFirestore(app,{ignoreUndefinedProperties:true});
const el=id=>document.getElementById(id);
const ui=h=>{el("app").innerHTML=h;};
const b64=s=>Uint8Array.from(atob(s.trim().replace(/-/g,"+").replace(/_/g,"/")),c=>c.charCodeAt(0));
let encBuf=null;
async function decrypt(k){
  if(!encBuf){const r=await fetch("q.enc",{cache:"no-cache"});if(!r.ok)throw new Error("HTTP "+r.status);encBuf=new Uint8Array(await r.arrayBuffer());}
  const key=await crypto.subtle.importKey("raw",b64(k),"AES-GCM",false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:encBuf.slice(0,12)},key,encBuf.slice(12));
  return JSON.parse(new TextDecoder().decode(pt));
}
function loginView(msg){
  ui('<form class="login" id="lf"><h1>SAT Math Practice</h1><p>Sign in to continue.</p><label>Username<input id="lu" autocomplete="username" required></label><label>Password<input id="lp" type="password" autocomplete="current-password" required></label><div class="err" id="le">'+(msg||"")+'</div><button class="bb" type="submit">Sign in</button></form>');
  el("lf").addEventListener("submit",async e=>{e.preventDefault();let u=el("lu").value.trim();if(!u.includes("@"))u+="@gmail.com";el("le").textContent="Signing in…";

}
function keyView(uid,kref,msg){
  ui('<form class="login" id="kf"><h1>One-time setup</h1><p>Paste the setup key to unlock the question pool. It\'s saved to your account, so you won\'t be asked again on any device.</p><label>Setup key<input id="kk" autocomplete="off" spellcheck="false" required></label><div class="err" id="ke">'+(msg||"")+'</div><button class="bb" type="submit">Unlock</button></form>');
  el("kf").addEventListener("submit",async e=>{e.preventDefault();const k=el("kk").value.trim();el("ke").textContent="Checking…";
    let Q;try{Q=await decrypt(k);}catch(err){el("ke").textContent="That key doesn't open the question pool. Check it and try again.";return;}
    try{await setDoc(kref,{k});}catch(err){}
    start(uid,Q);});
}
function start(uid,Q){
  const ref=p=>p.split("/");
  window.__FBDB={doc:p=>({set:d=>setDoc(doc(fs,"users",uid,...ref(p)),d)}),
    collection:p=>({get:async()=>{const s=await getDocs(collection(fs,"users",uid,...ref(p)));return{docs:s.docs.map(d=>({id:d.id,data:()=>d.data()}))};}})};
  window.__FBSIGNOUT=()=>signOut(auth).then(()=>location.reload());
  window.__SATSTART(Q,uid);
}
onAuthStateChanged(auth,async user=>{
  if(!user){loginView();return;}
  ui('<div class="empty" style="margin:40px 16px">Loading questions…</div>');
  const kref=doc(fs,"users",user.uid,"meta","key");
  let k=null;try{const s=await getDoc(kref);if(s.exists())k=s.data().k;}catch(e){}
  if(k){try{start(user.uid,await decrypt(k));return;}catch(e){}}
  keyView(user.uid,kref);
});
</script>
